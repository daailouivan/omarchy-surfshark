[package]
name = "omarchy-surfshark"
version = "1.0.0"
edition = "2021"
authors = ["daailouivan <ivan910209@gmail.com>"]
description = "An Omarchy plugin for Surfshark written in Rust"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
rand = "0.8"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
